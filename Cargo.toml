[package]
name = "duplicate-finder"
version = "1.0.0"
edition = "2024"

[dependencies]
blake3 = "1.8.7"
eframe = { version = "0.36.2", features = ["persistence"] }
egui_extras = { version = "0.36.2", features = ["file", "image"] }
globset = "0.4.20"
humansize = "2.1.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "ico", "tiff"] }
open = "5.4.4"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
trash = "5.2.9"
walkdir = "2.5.0"
